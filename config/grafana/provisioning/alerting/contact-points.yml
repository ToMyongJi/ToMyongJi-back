# 알림 메일 수신처.
# - 발송: grafana 서비스의 GF_SMTP_* (Gmail SMTP, docker-compose.yml)
# - 수신 주소: 컨테이너 환경변수 GRAFANA_ALERT_EMAIL (GitHub Secret → .env → compose)
#   public 레포라 실제 주소를 이 파일에 적지 않는다. Grafana provisioning은 $VAR 치환을 지원함.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: email-alert
    receivers:
      - uid: email-alert
        type: email
        settings:
          addresses: $GRAFANA_ALERT_EMAIL
          singleEmail: true
        disableResolveMessage: false

services:
  db:
    image: mysql:8.0
    container_name: ${APP_NAME}${ENV_SUFFIX}-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - app_network

  redis:
    image: redis:alpine
    container_name: ${APP_NAME}${ENV_SUFFIX}-redis
    restart: unless-stopped
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 100M
    networks:
      - app_network

  app:
    image: ${DOCKER_USERNAME}/${APP_NAME}:${IMAGE_TAG}
    container_name: ${APP_NAME}${ENV_SUFFIX}-app
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILE}
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      # Redis 설정
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || wget -qO- http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    networks:
      - app_network
    volumes:
      # 컨테이너의 로그 경로(/var/log/tomyongji/)를 호스트의 ./logs 폴더와 연결
      - ./app-logs:/var/log/tomyongji

  nginx:
    image: nginx:latest
    container_name: ${APP_NAME}${ENV_SUFFIX}-nginx
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    restart: unless-stopped
    command: >
      sh -c "
        echo 'Waiting for SSL certificate...';
        while ! test -f /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem; do
          sleep 5;
        done;
        echo 'Certificate found! Starting Nginx...';
        nginx -g 'daemon off;'
      "
    networks:
      - app_network

  certbot:
    image: certbot/certbot
    container_name: ${APP_NAME}${ENV_SUFFIX}-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done"
    restart: unless-stopped
    networks:
      - app_network

  alloy:
    image: grafana/alloy:latest
    profiles: [ "monitoring" ]
    container_name: ${APP_NAME}${ENV_SUFFIX}-alloy
    ports:
      - "12345:12345"
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy # 신규 설정 파일
      - ./app-logs:/var/log/app               # 로그 폴더 공유
      - alloy-data:/var/lib/alloy             # 위치 정보 저장용
    env_file: .env
    # run 명령어와 UI 접속 허용 설정
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy /etc/alloy/config.alloy
    deploy:
      resources:
        limits:
          memory: 100M
    restart: unless-stopped
    networks:
      - app_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ${APP_NAME}${ENV_SUFFIX}-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped
    networks:
      - app_network
    profiles: [ "monitoring" ]
    deploy:
      resources:
        limits:
          memory: 80M

  # ---- self-hosted-monitoring: Alloy/Grafana Cloud를 대체할 신규 스택 ----
  # 기존 monitoring profile(alloy, cadvisor)과 별도 profile로 병행 가능하게 분리.
  # 컷오버 전까지는 두 profile을 독립적으로 켜고 끌 수 있어야 함.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: [ "self-hosted-monitoring" ]
    container_name: ${APP_NAME}${ENV_SUFFIX}-node-exporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 30M

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    profiles: [ "self-hosted-monitoring" ]
    container_name: ${APP_NAME}${ENV_SUFFIX}-mysqld-exporter
    # v0.15.0부터 DATA_SOURCE_NAME 환경변수가 제거됨 → 플래그 + MYSQLD_EXPORTER_PASSWORD로 접속 정보 전달
    command:
      - '--mysqld.address=db:3306'
      - '--mysqld.username=root'
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${DB_PASSWORD}
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 24M

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    profiles: [ "self-hosted-monitoring" ]
    container_name: ${APP_NAME}${ENV_SUFFIX}-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 20M

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [ "self-hosted-monitoring" ]
    container_name: ${APP_NAME}${ENV_SUFFIX}-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=5d'
      - '--web.listen-address=0.0.0.0:9090'
    # 인증이 없으므로 외부에 열지 않는다 (docker 포트는 ufw를 우회함). 접속은 SSH 터널로.
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [ "self-hosted-monitoring" ]
    container_name: ${APP_NAME}${ENV_SUFFIX}-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      # 알림 메일 발송 (Gmail SMTP). 값은 모두 GitHub Secrets → .env 로 주입
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${GRAFANA_SMTP_USER:-}
      - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD:-}
      - GF_SMTP_FROM_ADDRESS=${GRAFANA_SMTP_USER:-}
      - GF_SMTP_FROM_NAME=ToMyongJi Grafana
      # contact-points.yml에서 참조하는 알림 수신 주소 (public 레포라 주소를 코드에 두지 않음)
      - GRAFANA_ALERT_EMAIL=${GRAFANA_ALERT_EMAIL:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    # 외부 노출하지 않고 SSH 터널(-L 3000:localhost:3000)로 접속
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - app_network
    deploy:
      resources:
        limits:
          memory: 150M

networks:
  app_network:
    driver: bridge
volumes:
  alloy-data:
  prometheus-data:
  grafana-data:

# Self-hosted Prometheus 설정.
# scrape 대상은 기존 config/config.alloy에 정의돼 있던 것과 동일하게 맞춤:
#   - Spring Boot(/actuator/prometheus), MySQL exporter, Redis exporter, cAdvisor
#   - node-exporter는 USE(자원) 대시보드를 위해 신규 추가
#
# docker-compose.yml의 app_network 안에서는 서비스명(app/db/redis 등)으로
# 서로를 찾을 수 있어서, config.alloy처럼 컨테이너명에 SPRING_PROFILE을
# 끼워 넣는 템플릿 문법이 필요 없다. dev/prod가 이 파일을 그대로 공유한다.

# Alerting은 별도 Alertmanager 컨테이너 없이 Grafana Alerting(unified alerting)으로
# 처리한다 (config/grafana/provisioning/alerting/) — t3.micro 메모리 여유가 없어서
# 컨테이너를 하나 더 늘리지 않기 위한 선택. 자세한 이유는 THRESHOLDS.md 참고.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  # A. Spring Boot 애플리케이션 (RED 지표 원천)
  - job_name: 'tomyongji-app'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [ 'app:8080' ]

  # B. MySQL (mysqld_exporter)
  - job_name: 'mysql'
    static_configs:
      - targets: [ 'mysqld-exporter:9104' ]

  # C. Redis (redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: [ 'redis-exporter:9121' ]

  # D. 컨테이너 자원 (cAdvisor)
  - job_name: 'cadvisor'
    static_configs:
      - targets: [ 'cadvisor-v2:8080' ]
    metric_relabel_configs:
      - source_labels: [ container_label_com_docker_compose_service ]
        target_label: container
      - action: labeldrop
        regex: '(id|image|name|endpoint|instance|container_label_.*)'

  # E. 호스트 자원 (node-exporter) — USE 대시보드용, 기존 Alloy 파이프라인엔 없던 대상
  - job_name: 'node-exporter'
    static_configs:
      - targets: [ 'node-exporter:9100' ]
